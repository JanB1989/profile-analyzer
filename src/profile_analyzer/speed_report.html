<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Speed</title>
<style>
:root{color-scheme:dark;--bg:#10161d;--panel:#18212b;--line:#303e4c;--muted:#a9b7c6;--text:#edf3fa;--accent:#69d4ba;--warm:#ffba79}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:28px;letter-spacing:-.8px;margin:3px 0}p{margin:8px 0}.eyebrow{color:var(--accent);letter-spacing:2px;font-size:11px;text-transform:uppercase}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin-top:20px}
/*__SPEED_CSS__*/
@media(max-width:650px){main{padding:16px}}
</style>
</head>
<body><main>
<div class="eyebrow">Europa Universalis V / game speed</div><h1 id="title">Seconds per game year</h1><p class="muted" id="subtitle"></p>
<section class="panel" id="speed"></section>
</main>
<script id="speed-data" type="application/json">__SPEED_JSON__</script>
<script>
'use strict';
/*__SPEED_CHART_JS__*/
const speed=JSON.parse(document.getElementById('speed-data').textContent);
document.getElementById('title').textContent=speed.label+' · seconds per game year';document.title=speed.label+' · Game Speed';
document.getElementById('subtitle').textContent='Session launched '+(speed.launch||'?')+' · playthrough '+(speed.playthrough||'—')+' · generated '+speed.generated;
renderSpeed(document.getElementById('speed'),speed);
</script>
</body></html>
